name: Build macOS Binary

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: PyInstaller installieren & bauen
        run: |
          pip install pyinstaller
          pyinstaller --onefile filesorting.py

      - name: Binary hochladen
        uses: actions/upload-artifact@v4
        with:
          name: file_sort-macos
          path: dist/file_sort
